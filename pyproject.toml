[project]
name = "primer-llamacpp"
version = "0.1.0"
description = "Small executable lessons for running and serving LLMs locally with llama.cpp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "llama-cpp-python>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
