[project]
name = "primer-llamacpp"
version = "0.1.0"
description = "Small executable lessons for running and serving LLMs locally with llama.cpp"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "llama-cpp-python>=0.3.0",
    "mypy>=1.0",
    "ruff>=0.11",
    "openai>=3.55.0",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
